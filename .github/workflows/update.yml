name: Update gold rate

on:
  schedule:
    # GitHub starts scheduled runs late (often 30-70 minutes), so run often and
    # at odd minutes. The script saves only when the rate changed.
    # Morning, India time: 09:17, 09:47, 10:17, 10:47, 11:17, 11:47, 12:17
    - cron: "47 3 * * *"
    - cron: "17,47 4,5,6 * * *"
    # Afternoon and evening, India time: 14:47, 15:17, 17:47, 18:17, 20:47, 21:17
    - cron: "17,47 9,12,15 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-gold-rate
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch rate
        run: python update_rates.py
      - name: Commit data
        run: |
          git config user.name "gold-rate-bot"
          git config user.email "gold-rate-bot@users.noreply.github.com"
          git add data.json
          git diff --staged --quiet || (git commit -m "Update gold rate" && git pull --rebase origin main && git push)
